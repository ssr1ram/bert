[package]
name = "bert-cli"
version = "0.2.1"
edition = "2021"
authors = ["Bert Contributors"]
description = "Rust CLI for Bert task management system"
license = "MIT"

[[bin]]
name = "bert"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
walkdir = "2.5"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
