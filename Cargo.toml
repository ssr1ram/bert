[package]
name = "bert-cli"
version = "0.4.0"
edition = "2021"
authors = ["Bert Contributors"]
description = "Rust CLI for Bert task management system"
license = "MIT"

[[bin]]
name = "bert"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# TUI dependencies
ratatui = "0.28.1"
crossterm = "0.28"
termbg = "0.6"
tui-markdown = "0.3.5"
arboard = "3.4"  # Clipboard support

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
