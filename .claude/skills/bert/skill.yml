# Bert Task Management Skill
# Build, Execute, and Refine Tasks

name: bert
version: "0.3.3"
description: Task management system for creating, organizing, and tracking hierarchical tasks with arbitrary nesting depth

# Compatibility metadata for Agent-OS harmony
compatibility:
  agent_os_version: "2.1"

# Feature flags (all disabled for Phase 0)
features:
  standards_injection: false       # Phase 1: Standards system
  workflow_modularization: false   # Phase 2: Modular workflows
  frontmatter_agents: false        # Phase 3: Agent frontmatter format

# Paths for future phases
paths:
  standards_directory: docs/bert/standards
  workflows_directory: .claude/skills/bert/workflows

# Configuration
config:
  # Root directory for BERT
  # All directory paths now use the default layout under bert_root:
  # - tasks: {bert_root}/tasks
  # - specs: {bert_root}/specs
  # - notes: {bert_root}/notes
  # - product: {bert_root}/product
  # - prompts/library: {bert_root}/prompts/library
  # - prompts/sets: {bert_root}/prompts/sets
  # - prompts/logs: {bert_root}/prompts/logs
  # - archive: {bert_root}/archive
  # - archive/tasks: {bert_root}/archive/tasks
  # - archive/specs: {bert_root}/archive/specs
  # - archive/notes: {bert_root}/archive/notes
  bert_root: docs/bert

  # TUI configuration
  tui:
    # Pane width percentages (must sum to 100)
    pane_widths:
      explorer: 30    # Left pane - file tree (reduced)
      buffer: 30      # Middle pane - working buffer/queue (same)
      preview: 40     # Right pane - file preview (increased)

# Available operations
operations:
  # Task operations (standard Bert)
  - task-author: Generate parent task from file analysis or improvement request
  - task-create: Create subtasks with nested numbering support
  - list-tasks: List all tasks and their status
  - update-status: Update task status
  - archive-task: Archive a task and its associated notes by task number

  # Spec operations (NEW - invoked via /spec command)
  - spec-new: Create new spec with requirements gathering
  - spec-write: Generate specification from requirements
  - spec-tasks: Propose task breakdown from spec
  - spec-approve: Finalize spec and create task files
